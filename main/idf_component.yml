## IDF Component Manager Manifest File
dependencies:
  idf:
    version: '>=6.0'
  espressif/usb: ^1
  # espressif/es8311 is deprecated upstream and declares idf <6.0;
  # esp_codec_dev is the maintained replacement and uses the new I2C driver.
  espressif/esp_codec_dev: ^1.6
  # IDF v6.0 moved the vendor Ethernet PHY drivers out of esp_eth and into
  # esp-eth-drivers; only esp_eth_phy_new_generic() is still in-tree.
  espressif/ip101: ^1.1
  espressif/mdns: ^1
  # WiFi comes from the ESP32-C6 over SDIO. Pinned to the version the C6's
  # slave firmware was built from -- host and co-processor must stay in
  # lockstep (see ../c6-notes.md).
  espressif/esp_hosted:
    version: '==2.12.6'
  espressif/esp_wifi_remote:
    version: '>=1.3.1'
  # SSH server (vendored upstream libssh). See main/net_ssh.c and the note in
  # the top-level CMakeLists about mbedTLS 4.0.0.
  david-cermak/libssh: '^0.12.2'
